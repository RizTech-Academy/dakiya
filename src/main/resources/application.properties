# Development defaults (in-memory H2). For production, set the prod profile and a real
# DATABASE_URL / secrets via environment variables (see README).
spring.datasource.url=jdbc:h2:mem:dakiya
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.flyway.enabled=false

management.endpoints.web.exposure.include=health,info
